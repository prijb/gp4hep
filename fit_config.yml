
general:
  hist_name_data: 'h_mjj_sig'
  hist_name_signal: 'h_mjj_sig'

  # Signal properties
  signal_mass: 450 
  xs: 1000
  lumi: 22.8
  rebin: 5

  inject_signal: 0

fit_settings:
  range: [200, 700] # If null, just fit over the whole range

  r: 1 # Overrides assumption of 1

  scale_data: False # Scale data to pb/GeV units

  # Description of signal functions (make sure variables are declared in order called)
  signal: 'fit'                 # Options are 'zero', 'template' and 'fit'
  signal_function: 'DSCB'
  DSCB:
    init:
      a: 1000.0
      mu: 350.0
      sigma: 50.0
      n_low: 2.0
      alpha_low: 1.0
      n_high: 2.0
      alpha_high: 1.0
    bounds:
      a: [null, null]
      mu: [250.0, 450.0]
      sigma: [30.0, 200.0]
      n_low: [1.0, 50.0]
      alpha_low: [0.1, 50.0]
      n_high: [1.0, 50.0]
      alpha_high: [0.1, 50.0]

  # Description of background functions (make sure variables are declared in order called)
  background_function: 'mod_exp'
  #background_function: 'poly_ext' 
  #background_function: 'dijet'
  #background_function: null
  mod_exp:
    init:
      p0: 1000.0
      p1: -210.0
      p2: 1.18
      p3: 6.8
      p4: 85.0
    bounds:
      p0: [null, null]
      p1: [-280.0, -150.0]
      p2: [0.7, 3.0]
      p3: [1.0, 20.0]
      p4: [50.0, 150.0]

  poly_ext:
    init:
      p0: 1.0
      p1: 50.0
      p2: 2.0
      p3: 0.1
      p4: -10.0
    bounds:
      p0: [null, null]
      p1: [null, null]
      p2: [null, null]
      p3: [null, null]
      p4: [null, null]

  dijet:
    init:
      p0: 1.0
      p1: 9.5
      p2: 4.5
      p3: -0.3
      p4: -0.08
    bounds:
      p0: [null, null]
      p1: [5, 15]
      p2: [3, 7]
      p3: [-1, 1]
      p4: [-1, 1]

kernel_settings:
  exponentiate_params: True     
  kernel: 'RBF' 

  # Kernel description (make sure variables are declared in order called)
  RBF: &RBF
    init:
      variance: 1.0e+3
      length_scale: 10.0
    bounds:
      variance: [1.0, null]
      length_scale: [5.0, 50.0]
  
  Gibbs: &Gibbs
    init:
      variance: 1.0e+3
      a: 1.0e+3
      b: 0.1
      c: 20.0
      d: 0.1

    bounds:
      variance: [1.0, null]
      a: [1.0, null]
      b: [1.0e-4, null]
      c: [5.0, 50.0]
      d: [1.0e-4, null]

  
